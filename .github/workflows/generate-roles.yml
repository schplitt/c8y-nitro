name: Generate roles

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-roles:
    name: Regenerate role types
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate roles
        run: pnpm gen:roles

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(roles): update generated role types from OpenAPI spec'
          title: 'chore(roles): update generated role types'
          body: |
            Automated update of `src/types/roles.generated.ts` from the
            Cumulocity core OpenAPI spec.

            Regenerated by the `generate-roles` scheduled workflow.
          branch: chore/update-role-types
          delete-branch: true
          add-paths: src/types/roles.generated.ts
