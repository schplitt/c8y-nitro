name: Contract (real tenant)

# Runs the c8y-nitro/testing contract scenarios against a real Cumulocity
# tenant, so the fake tenant keeps behaving like the platform as it evolves.
# Needs the repository secrets C8Y_CONTRACT_BASEURL, C8Y_CONTRACT_TENANT,
# C8Y_CONTRACT_USER, and C8Y_CONTRACT_PASSWORD (a dedicated test tenant/user;
# scenarios create data and delete it again). Opens or updates an issue when
# the platform and the fake disagree.

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one run at a time against the shared tenant
  group: contract-real-tenant
  cancel-in-progress: false

jobs:
  contract:
    name: Contract scenarios against a real tenant
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      C8Y_CONTRACT_BASEURL: ${{ secrets.C8Y_CONTRACT_BASEURL }}
      C8Y_CONTRACT_TENANT: ${{ secrets.C8Y_CONTRACT_TENANT }}
      C8Y_CONTRACT_USER: ${{ secrets.C8Y_CONTRACT_USER }}
      C8Y_CONTRACT_PASSWORD: ${{ secrets.C8Y_CONTRACT_PASSWORD }}
    steps:
      - name: Check credentials
        id: credentials
        run: |
          if [ -z "$C8Y_CONTRACT_BASEURL" ] || [ -z "$C8Y_CONTRACT_TENANT" ] || [ -z "$C8Y_CONTRACT_USER" ] || [ -z "$C8Y_CONTRACT_PASSWORD" ]; then
            echo "::notice::C8Y_CONTRACT_* secrets are not set; skipping the real-tenant contract run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: steps.credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup node
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.credentials.outputs.configured == 'true'
        run: pnpm build

      - name: Contract scenarios
        if: steps.credentials.outputs.configured == 'true'
        run: pnpm test:contract

      - name: Report drift
        if: failure() && steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create contract-drift --color D93F0B --description "The fake tenant differs from the real platform" 2>/dev/null || true
          existing=$(gh issue list --label contract-drift --state open --json number --jq '.[0].number')
          body="The contract scenarios failed against the real tenant: $RUN_URL

          Either the platform changed or the fake tenant of \`c8y-nitro/testing\` is wrong. Reproduce with \`pnpm test:contract\`, fix the fake (src/testing), and note the behavior in docs/guide/testing.md."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label contract-drift --title "Contract drift: fake tenant differs from the real platform" --body "$body"
          fi
